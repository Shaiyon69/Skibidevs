<!DOCTYPE html>
<html lang="en">
<head>

    <title>Skibidevs</title>
    <meta name="description" content="Free apps and a game, made by Sha and friends.">
    <link rel="icon" href="/Skibidevs/assets/img/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
        <a class="wordmark" href="/Skibidevs/">Skibidevs</a>
        <nav class="tabs" aria-label="Sections">

            <a href="/Skibidevs/playroom/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/></svg><span>Play</span></a>
            <a href="/Skibidevs/appendix/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>More</span></a>
        </nav>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch light or dark theme" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>

    <main id="main">
        <section class="hero">
            <h1>Free apps by Sha and friends.</h1>
            <p>No ads, no accounts. Grab one or play the game.</p>
        </section>

        <div id="homeFeature" aria-live="polite"></div>

            <div class="section-head">
                <h2 id="appsTitle">Apps</h2>
                <a href="/Skibidevs/apptic/">See all</a>
            </div>
            <div class="app-list" id="homeApps" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </section>

        <section class="section">
            <a class="play-banner" href="/Skibidevs/playroom/">
                <img src="/Skibidevs/assets/img/apps/convallaria.png" alt="" width="64" height="64">

                    <h2>Convallaria</h2>
                    <p>A cozy farming RPG. Runs in your browser.</p>
                </div>
                <span class="get">Play</span>
            </a>
        </section>
    </main>

    <footer class="footer">
        <span>&copy; 2026 Skibidevs &middot; made by Sha and friends &middot; free and open source</span>
        <nav aria-label="Elsewhere">
