name: Refresh releases

# Keeps data/releases.json and updates/<app>/latest.json in step with each app's GitHub releases. Runs hourly, by hand, or when an
# app's release workflow sends a repository_dispatch event of type "app-released".
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [app-released]

permissions:
  contents: write

concurrency: refresh-releases

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tauri apps (Chimaera, Messapp, Shaiyon Apps) check https://shaiyon69.github.io/Skibidevs/updates/<id>/latest.json for updates.
      - name: Publish updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every app marked "updater": true in data/apptic.json, by id and tag prefix.
          jq -r '.apps[] | select(.updater) | "\(.id) \(.tagPrefix)"' data/apptic.json | while read -r app prefix; do
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq "map(select(.tagName | startswith(\"${prefix}v\")))[0].tagName // empty")
            [ -n "$tag" ] || continue
            mkdir -p "updates/$app"
            # Releases made before the updater shipped have no latest.json; keep the last good one.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output "updates/$app/latest.json" --clobber || echo "$tag has no latest.json"
          done
      - name: Commit if changed
        run: |
          git add data/releases.json
          if [ -d updates ]; then git add updates; fi
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh releases"
          git push
