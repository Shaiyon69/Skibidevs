name: Refresh releases

# Keeps data/releases.json in step with each app's GitHub releases. Runs hourly, by hand, or when an
# app's release workflow sends a repository_dispatch event of type "app-released".
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [app-released]

permissions:
  contents: write

concurrency: refresh-releases

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet -- data/releases.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git commit -m "chore: refresh releases"
          git push
